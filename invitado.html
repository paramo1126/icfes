<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SECCIONES DE TIEMPO ESTUDIO</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --green:#10B981;
    --green-soft:#10b98133;
    --orange:#F97316;
    --orange-soft:#f9731633;
    --bg-0:#05070a;
    --bg-1:#0b1117;
    --bg-2:#111a23;
    --text:#e6edf3;
    --muted:#8b97a7;
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(255,255,255,0.08);
    --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(249,115,22,.18), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(16,185,129,.20), transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 60%,var(--bg-0));
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    padding:24px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
  .brand img{
    display:block;
    height:clamp(34px,7vw,52px);
    width:auto;max-width:70vw;
    object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(16,185,129,.35));
  }
  .pill{
    font-size:12px;color:var(--muted);
    padding:6px 12px;border-radius:999px;
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);
  }

  .grid{
    display:grid;gap:20px;
    grid-template-columns:1fr;
  }
  @media(min-width:900px){
    .grid{grid-template-columns:1.2fr .9fr}
  }

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:24px;
    padding:28px;
    box-shadow:var(--shadow);
  }

  /* TIMER */
  .timer-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;min-height:480px;position:relative;overflow:hidden;
  }
  .timer-card::before{
    content:"";position:absolute;inset:-1px;border-radius:24px;pointer-events:none;
    background:linear-gradient(135deg,rgba(16,185,129,.25),transparent 40%,rgba(249,115,22,.18));
    mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .status{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;
    background:var(--green-soft);color:var(--green);
    border:1px solid rgba(16,185,129,.35);
    transition:.3s;
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  .status.rest{background:var(--orange-soft);color:var(--orange);border-color:rgba(249,115,22,.4)}
  .status.paused{background:rgba(148,163,184,.15);color:#cbd5e1;border-color:rgba(203,213,225,.25)}
  .status.done{background:rgba(16,185,129,.18);color:#34d399;border-color:rgba(52,211,153,.4)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

  .ring-wrap{position:relative;width:min(78vw,320px);aspect-ratio:1/1}
  svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:10}
  .ring-fg{
    fill:none;stroke:url(#grad);stroke-width:10;stroke-linecap:round;
    transition:stroke-dashoffset .9s linear,stroke .4s;
    filter:drop-shadow(0 0 12px rgba(16,185,129,.45));
  }
  .ring-content{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
  }
  .time{
    font-size:clamp(48px,11vw,76px);font-weight:800;letter-spacing:-2px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9aa4b2);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cycle-label{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

  /* BUTTONS */
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .btn{
    appearance:none;border:none;cursor:pointer;font:inherit;
    padding:13px 22px;border-radius:14px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.2px;
    transition:transform .15s ease,box-shadow .25s,background .25s,opacity .2s;
    color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{
    background:linear-gradient(135deg,var(--green),#059669);
    box-shadow:0 12px 30px -10px rgba(16,185,129,.7);border-color:transparent;
  }
  .btn.primary:hover{box-shadow:0 18px 40px -10px rgba(16,185,129,.8)}
  .btn.warn{
    background:linear-gradient(135deg,var(--orange),#ea580c);
    box-shadow:0 12px 30px -10px rgba(249,115,22,.6);border-color:transparent;
  }
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--text)}

  /* CONFIG */
  h2.section-title{
    font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);
    margin-bottom:18px;font-weight:600;
  }
  .inputs{display:grid;gap:14px}
  .field{
    display:flex;flex-direction:column;gap:6px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--glass-border);
    border-radius:14px;padding:14px 16px;
    transition:border-color .2s,background .2s;
  }
  .field:focus-within{border-color:var(--green);background:rgba(16,185,129,.06)}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600}
  .field-row{display:flex;align-items:center;gap:10px}
  .field input{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;
  }
  .field .unit{font-size:12px;color:var(--muted);font-weight:600}
  .field.orange:focus-within{border-color:var(--orange);background:rgba(249,115,22,.06)}

  /* SUMMARY */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .stat{
    background:rgba(255,255,255,.03);
    border:1px solid var(--glass-border);
    border-radius:14px;padding:14px 10px;text-align:center;
  }
  .stat .v{font-size:20px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
  .stat:nth-child(2) .v{color:#fff}
  .stat:nth-child(3) .v{color:var(--orange)}
  .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-top:4px}

  /* PROGRESS BAR (session total) */
  .bar-wrap{margin-top:22px}
  .bar-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .bar{height:8px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
  .bar > i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--green),var(--orange));
    border-radius:999px;transition:width .8s ease;
    box-shadow:0 0 16px rgba(16,185,129,.6);
  }

  footer{
    text-align:center;color:var(--muted);font-size:12px;margin-top:32px;
  }

  @media(max-width:420px){
    body{padding:18px 12px 50px}
    .card{padding:20px;border-radius:20px}
    .timer-card{min-height:auto;padding:24px 16px}
    .controls .btn{padding:12px 16px;font-size:13px;flex:1 1 calc(50% - 10px);justify-content:center}
    .summary{grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{padding:12px 6px}
    .stat .v{font-size:16px}
    header.top{margin-bottom:18px}
    .pill{display:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <img src="assets/brand-s11.png" alt="S11 · Tu ritmo al 500" />
      </div>
      <div class="pill">Sesión de estudio · modo invitado</div>
    </header>

    <main class="grid">
      <!-- TIMER -->
      <section class="card timer-card">
        <div id="status" class="status"><span class="dot"></span><span id="statusText">Listo para empezar</span></div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 220 220">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#10B981"/>
                <stop offset="100%" stop-color="#F97316"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="110" cy="110" r="100"/>
            <circle id="ringFg" class="ring-fg" cx="110" cy="110" r="100"
                    stroke-dasharray="628.318" stroke-dashoffset="0"/>
          </svg>
          <div class="ring-content">
            <div id="time" class="time">00:00</div>
            <div class="cycle-label">Ciclo <span id="cycleNow">0</span> / <span id="cycleTotal">0</span></div>
          </div>
        </div>

        <div class="controls">
          <button id="btnStart" class="btn primary">▶ Iniciar</button>
          <button id="btnPause" class="btn warn" disabled>⏸ Pausar</button>
          <button id="btnResume" class="btn ghost" disabled>⏵ Continuar</button>
          <button id="btnReset" class="btn ghost">↻ Reiniciar</button>
        </div>
      </section>

      <!-- CONFIG -->
      <section class="card">
        <h2 class="section-title">Configura tu sesión</h2>
        <div class="inputs">
          <div class="field">
            <label for="studyMin">Minutos de estudio</label>
            <div class="field-row">
              <input id="studyMin" type="number" min="1" max="180" value="50"/>
              <span class="unit">min</span>
            </div>
          </div>
          <div class="field orange">
            <label for="breakMin">Minutos de descanso</label>
            <div class="field-row">
              <input id="breakMin" type="number" min="1" max="60" value="10"/>
              <span class="unit">min</span>
            </div>
          </div>
          <div class="field">
            <label for="cycles">Número de ciclos</label>
            <div class="field-row">
              <input id="cycles" type="number" min="1" max="20" value="4"/>
              <span class="unit">ciclos</span>
            </div>
          </div>
        </div>

        <div class="summary">
          <div class="stat"><div class="v" id="sCycle">0/0</div><div class="k">Ciclo</div></div>
          <div class="stat"><div class="v" id="sTotal">0 min</div><div class="k">Total planeado</div></div>
          <div class="stat"><div class="v" id="sLeft">0 min</div><div class="k">Restante</div></div>
        </div>

        <div class="bar-wrap">
          <div class="bar-head"><span>Progreso de sesión</span><span id="pct">0%</span></div>
          <div class="bar"><i id="bar"></i></div>
        </div>
      </section>
    </main>

    <footer>Hecho para concentrarse · técnica Pomodoro libre</footer>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const studyMin=$("studyMin"), breakMin=$("breakMin"), cycles=$("cycles");
  const timeEl=$("time"), statusEl=$("status"), statusText=$("statusText");
  const cycleNow=$("cycleNow"), cycleTotal=$("cycleTotal");
  const sCycle=$("sCycle"), sTotal=$("sTotal"), sLeft=$("sLeft"), pct=$("pct"), bar=$("bar");
  const ringFg=$("ringFg");
  const btnStart=$("btnStart"), btnPause=$("btnPause"), btnResume=$("btnResume"), btnReset=$("btnReset");

  const RING_C = 2*Math.PI*100; // 628.318
  ringFg.setAttribute("stroke-dasharray", RING_C);

  // ===== Alarma (WebAudio, sin archivos) =====
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }
  function rattleTone(freq, delayMs, vol){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + (delayMs/1000);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t0);
    // envolvente muy corta: ataque instantáneo, decaimiento rápido → “tr”
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.22, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0+0.12);
  }
  function playAlarm(kind){
    ensureAudio();
    if(!audioCtx) return;
    // “trtrtrtrtrtrtrtrtr” — 24 golpecitos rápidos en ~2.5 s
    const base = 880; // A5
    for(let i=0;i<24;i++){
      const ms = i*105;
      const f = base + (i%3)*35; // leve variación para que no sea monótono
      rattleTone(f, ms, 0.20);
      rattleTone(f+6, ms+25, 0.12); // segunda voz desafinada para más “trr”
    }
    if(navigator.vibrate){ try{ navigator.vibrate([80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40,80,40]); }catch(e){} }
  }

  let state = "idle"; // idle | study | break | paused | done
  let prevState = "study";
  let cycleIdx = 0;     // 1..N during run
  let phaseTotal = 0;   // seconds in current phase
  let phaseLeft = 0;    // seconds left in current phase
  let totalPlanned = 0; // seconds whole session
  let elapsedBefore = 0;// seconds completed before current phase
  let tickId = null;

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }

  function setStatus(kind, text){
    statusEl.className = "status " + (kind==="study"?"":kind);
    statusText.textContent = text;
  }

  function readConfig(){
    const sm = Math.max(1, Math.min(180, parseInt(studyMin.value)||50));
    const bm = Math.max(1, Math.min(60,  parseInt(breakMin.value)||10));
    const cy = Math.max(1, Math.min(20,  parseInt(cycles.value)||4));
    studyMin.value=sm; breakMin.value=bm; cycles.value=cy;
    return {sm,bm,cy};
  }

  function updateSummary(){
    const {sm,bm,cy} = readConfig();
    totalPlanned = (sm+bm)*cy*60;
    cycleTotal.textContent = cy;
    if(state==="idle" || state==="done"){
      cycleNow.textContent = state==="done" ? cy : 0;
      timeEl.textContent = fmt(sm*60);
      ringFg.setAttribute("stroke-dashoffset", RING_C);
    }
    sCycle.textContent = (cycleIdx||0)+"/"+cy;
    sTotal.textContent = Math.round(totalPlanned/60)+" min";
    const done = elapsedBefore + (phaseTotal - phaseLeft);
    const left = Math.max(0, totalPlanned - done);
    sLeft.textContent = Math.ceil(left/60)+" min";
    const p = totalPlanned ? Math.min(100, (done/totalPlanned)*100) : 0;
    pct.textContent = Math.round(p)+"%";
    bar.style.width = p+"%";
  }

  function updateRing(){
    if(!phaseTotal){ ringFg.setAttribute("stroke-dashoffset", RING_C); return; }
    const prog = 1 - (phaseLeft/phaseTotal);
    ringFg.setAttribute("stroke-dashoffset", RING_C*(1-prog));
  }

  function startPhase(kind){
    const {sm,bm} = readConfig();
    state = kind;
    if(kind==="study"){
      phaseTotal = sm*60;
      setStatus("study", "Estudiando · Ciclo "+cycleIdx);
      ringFg.style.stroke = "url(#grad)";
    } else {
      phaseTotal = bm*60;
      setStatus("rest", "Descanso · Ciclo "+cycleIdx);
    }
    phaseLeft = phaseTotal;
    timeEl.textContent = fmt(phaseLeft);
    cycleNow.textContent = cycleIdx;
    updateRing();
    updateSummary();
    runTick();
  }

  function runTick(){
    clearInterval(tickId);
    let last = performance.now();
    tickId = setInterval(()=>{
      const now = performance.now();
      const dt = (now-last)/1000; last = now;
      phaseLeft -= dt;
      if(phaseLeft <= 0){
        elapsedBefore += phaseTotal;
        phaseLeft = 0;
        timeEl.textContent = "00:00";
        updateRing(); updateSummary();
        nextPhase();
        return;
      }
      timeEl.textContent = fmt(phaseLeft);
      updateRing();
      updateSummary();
    }, 250);
  }

  function nextPhase(){
    const {cy} = readConfig();
    if(state==="study"){
      playAlarm("break");
      startPhase("break");
    } else if(state==="break"){
      if(cycleIdx >= cy){ finish(); }
      else { playAlarm("study"); cycleIdx++; startPhase("study"); }
    }
  }

  function finish(){
    clearInterval(tickId); tickId=null;
    state = "done";
    playAlarm("done");
    setStatus("done","¡Sesión terminada! 🎉");
    timeEl.textContent = "00:00";
    ringFg.setAttribute("stroke-dashoffset", 0);
    bar.style.width="100%"; pct.textContent="100%";
    btnStart.disabled=false; btnPause.disabled=true; btnResume.disabled=true;
  }

  // Controls
  btnStart.addEventListener("click", ()=>{
    ensureAudio();
    clearInterval(tickId);
    cycleIdx = 1;
    elapsedBefore = 0;
    phaseTotal = 0; phaseLeft = 0;
    startPhase("study");
    btnStart.disabled=true; btnPause.disabled=false; btnResume.disabled=true;
  });

  btnPause.addEventListener("click", ()=>{
    if(state==="study"||state==="break"){
      clearInterval(tickId); tickId=null;
      prevState = state;
      state = "paused";
      setStatus("paused","En pausa");
      btnPause.disabled=true; btnResume.disabled=false;
    }
  });

  btnResume.addEventListener("click", ()=>{
    if(state==="paused"){
      state = prevState;
      setStatus(state==="study"?"study":"rest",
                (state==="study"?"Estudiando · Ciclo ":"Descanso · Ciclo ")+cycleIdx);
      runTick();
      btnPause.disabled=false; btnResume.disabled=true;
    }
  });

  btnReset.addEventListener("click", ()=>{
    clearInterval(tickId); tickId=null;
    state="idle"; cycleIdx=0; elapsedBefore=0; phaseTotal=0; phaseLeft=0;
    setStatus("","Listo para empezar");
    ringFg.style.stroke = "url(#grad)";
    ringFg.setAttribute("stroke-dashoffset", RING_C);
    bar.style.width="0%"; pct.textContent="0%";
    btnStart.disabled=false; btnPause.disabled=true; btnResume.disabled=true;
    updateSummary();
  });

  [studyMin,breakMin,cycles].forEach(i=>i.addEventListener("input",()=>{
    if(state==="idle"||state==="done") updateSummary();
    else updateSummary();
  }));

  updateSummary();
})();
</script>
</body>
</html>
